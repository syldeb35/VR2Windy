name: Publish plugin to Windy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-windy-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Prepare plugin archive
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          plugin_name="$(jq -r '.name // empty' dist/plugin.json)"
          if [[ ! "$plugin_name" =~ ^windy-plugin-[a-z0-9-]+$ ]]; then
            echo "Invalid Windy plugin name in dist/plugin.json: $plugin_name" >&2
            exit 1
          fi

          jq \
            --arg repositoryName "$REPOSITORY" \
            --arg commitSha "$COMMIT_SHA" \
            --arg repositoryOwner "$REPOSITORY_OWNER" \
            '. + {repositoryName: $repositoryName, commitSha: $commitSha, repositoryOwner: $repositoryOwner}' \
            dist/plugin.json > dist/plugin.json.tmp
          mv dist/plugin.json.tmp dist/plugin.json

          tar -cf plugin.tar -C dist .

      - name: Publish to Windy
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
        run: |
          if [[ -z "$WINDY_API_KEY" ]]; then
            echo "GitHub secret WINDY_API_KEY is not configured." >&2
            exit 1
          fi

          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "x-windy-api-key: $WINDY_API_KEY" \
            --form "plugin_archive=@plugin.tar" \
            https://node.windy.com/plugins/v1.0/upload
